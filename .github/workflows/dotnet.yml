name: Part 2 CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "Raceday API (prog part 2).sln"

      - name: Build
        run: dotnet build "Raceday API (prog part 2).sln" --configuration Release --no-restore

      - name: Test
        run: dotnet test "Raceday API (prog part 2).sln" --configuration Release --no-build --verbosity normal